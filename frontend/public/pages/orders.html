<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders – QuickDeliver</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .fpill{padding:6px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .2s}
  .fpill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .ord-card{background:#fff;border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .ord-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
  .ord-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{background:#f1f5f9;color:#374151;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:500}
  .ord-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
  .ord-foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #f1f5f9}
  .alert-band{background:#fef3c7;border:1px solid #fde047;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400e;margin-bottom:8px}
</style>
</head>
<body>
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div class="app-shell">
  <div id="sidebar" class="sidebar"></div>
  <div class="main-area">
    <div id="topbar" class="topbar"></div>
    <div class="page-content">
      <div class="page-header"><h1>📦 My Orders</h1><p>Track all your deliveries</p></div>
      <div class="filter-pills" id="pills"></div>
      <div id="content"><div class="spinner"></div></div>
    </div>
  </div>
</div>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script>
  const _u = requireRole(['customer']); if (!_u) throw '';
  initShell('customer','My Orders');
  const sts=['all','placed','confirmed','assigned','picked_up','in_transit','out_for_delivery','delivered','rescheduled','cancelled'];
  let orders=[],filter='all';

  function renderPills(){
    document.getElementById('pills').innerHTML=sts.map(s=>{
      const cnt=s==='all'?orders.length:orders.filter(o=>o.status===s).length;
      return `<button class="fpill${filter===s?' active':''}" onclick="setFilter('${s}')">${s.replace(/_/g,' ')} (${cnt})</button>`;
    }).join('');
  }

  function setFilter(f){filter=f;renderPills();renderOrders();}

  function renderOrders(){
    const list=filter==='all'?orders:orders.filter(o=>o.status===filter);
    const c=document.getElementById('content');
    if(!list.length){c.innerHTML=`<div class="empty-state"><div class="icon">📦</div><h3>No orders found</h3><a href="/products" class="btn btn-primary">Start Shopping →</a></div>`;return;}
    c.innerHTML=list.map(o=>{
      const alerts=o.notifications?.filter(n=>['weather','traffic','delay','reschedule'].includes(n.type));
      const lastAlert=alerts?.slice(-1)[0];
      return `<div class="ord-card">
        <div class="ord-head">
          <div><strong style="font-size:14px">#${o.orderNumber}</strong> <span class="badge status-${o.status}">${o.status.replace(/_/g,' ')}</span></div>
          <span style="font-size:12px;color:var(--muted)">${new Date(o.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
        </div>
        <div class="ord-chips">${o.items.slice(0,3).map(i=>`<span class="chip">${i.name} ×${i.quantity}</span>`).join('')}${o.items.length>3?`<span class="chip">+${o.items.length-3} more</span>`:''}</div>
        <div class="ord-meta">
          <span>⏰ ${o.timeSlot?.date} — ${o.timeSlot?.slot}</span>
          <span>💳 ${o.paymentMethod?.toUpperCase()}</span>
          ${o.agent?`<span>🚴 ${o.agent.name}</span>`:''}
        </div>
        ${lastAlert?`<div class="alert-band">${lastAlert.message}</div>`:''}
        <div class="ord-foot">
          <span style="font-weight:900;font-size:18px;color:var(--primary)">₹${o.totalAmount}</span>
          <a href="/order/${o._id}" class="btn btn-primary btn-sm">View Details →</a>
        </div>
      </div>`;
    }).join('');
  }

  async function load(){
    try{const d=await api('GET','/api/orders/my');orders=d.orders||[];renderPills();renderOrders();}
    catch(e){document.getElementById('content').innerHTML=`<div class="empty-state"><div class="icon">⚠️</div><h3>${e.message}</h3></div>`;}
  }
  load();
</script>
</body>
</html>
