spring.application.name=quickdeliver

# Reads the same .env file the Node version used (MONGO_URI, JWT_SECRET, ...). Optional.
spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:5000}

# Mongo (database name comes from the URI path, like Mongoose)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/quickdeliver}
# Creates the unique indexes (users.email, orders.orderNumber) the way Mongoose did
spring.data.mongodb.auto-index-creation=true

# JSON: ISO-8601 dates and omit nulls, matching what the Node API sent to the frontend
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.expire=${JWT_EXPIRE:7d}

# Only needed when the frontend calls the backend directly from another origin (e.g. Netlify without the /api proxy).
# Comma separated, e.g. https://my-site.netlify.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Admin account created by the seeder
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Time zone used for "today", slot load, traffic hour and weather day (AI endpoints)
app.zone=${APP_ZONE:Asia/Kolkata}

# Set by the "seed" profile
app.seed=false
